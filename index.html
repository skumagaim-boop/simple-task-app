<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="毎日のやることをシンプルに管理できるタスクアプリ" />
    <title>Simple Tasks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">MY TASKS</p>
        <h1>今日のタスク</h1>
        <p class="subtitle">やることを整理して、一つずつ進めよう。</p>
      </header>

      <section class="task-panel" aria-labelledby="task-heading">
        <h2 id="task-heading" class="visually-hidden">タスク一覧</h2>
        <form id="task-form" class="task-form">
          <label class="visually-hidden" for="task-title">新しいタスク</label>
          <input id="task-title" name="title" maxlength="100" required placeholder="新しいタスクを入力..." autocomplete="off" />
          <button type="submit" class="add-button">追加</button>
        </form>

        <div class="list-heading">
          <span>タスク</span>
          <span id="task-count" aria-live="polite">0 件</span>
        </div>
        <ul id="task-list" class="task-list"></ul>
        <div id="empty-state" class="empty-state">
          <span aria-hidden="true">✓</span>
          <p>タスクはまだありません</p>
          <small>新しいタスクを追加してみましょう</small>
        </div>
      </section>
    </main>

    <template id="task-template">
      <li class="task-item">
        <label class="task-check">
          <input type="checkbox" />
          <span class="checkmark" aria-hidden="true"></span>
          <span class="task-text"></span>
        </label>
        <button type="button" class="delete-button" aria-label="タスクを削除">
          <span aria-hidden="true">削除</span>
        </button>
      </li>
    </template>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
