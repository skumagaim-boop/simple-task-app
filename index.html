<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="今日やることをすっきり管理できるタスクアプリ" />
    <title>My Tasks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m7.5 12 3 3 6-7" /></svg>
        </div>
        <div>
          <p class="eyebrow">SIMPLE TASK MANAGER</p>
          <h1>My Tasks</h1>
          <p class="subtitle">今日やることを、ひとつずつ。</p>
        </div>
      </header>

      <section class="task-panel" aria-labelledby="form-title">
        <div class="panel-heading">
          <div class="heading-icon" aria-hidden="true">＋</div>
          <div>
            <h2 id="form-title">新しいタスク</h2>
            <p>やることをリストに追加しましょう</p>
          </div>
        </div>

        <form id="task-form" novalidate>
          <div class="field">
            <label for="task-title">タイトル <span class="required">必須</span></label>
            <input
              id="task-title"
              name="title"
              type="text"
              maxlength="100"
              placeholder="例：週次レポートを作成する"
              aria-describedby="title-error"
              required
            />
            <p id="title-error" class="error-message" role="alert" aria-live="polite"></p>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="task-description">説明</label>
              <span>任意</span>
            </div>
            <textarea
              id="task-description"
              name="description"
              rows="3"
              maxlength="500"
              placeholder="詳細やメモを入力できます"
            ></textarea>
          </div>

          <button class="primary-button" type="submit">
            <span aria-hidden="true">＋</span> タスクを追加
          </button>
        </form>
      </section>

      <section class="list-section" aria-labelledby="list-title">
        <div class="list-heading">
          <div>
            <p class="eyebrow">YOUR LIST</p>
            <h2 id="list-title">タスク一覧</h2>
          </div>
          <span id="task-count" class="task-count">0 件</span>
        </div>
        <div id="task-list" class="task-list" aria-live="polite"></div>
      </section>
    </main>

    <template id="empty-template">
      <div class="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 6h11M8 12h11M8 18h11M3.5 6h.01M3.5 12h.01M3.5 18h.01" /></svg>
        </div>
        <h3>タスクはまだありません</h3>
        <p>上のフォームから最初のタスクを追加してみましょう。</p>
      </div>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
