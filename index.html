<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>今日のタスク</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">MY TASKS</p>
          <h1>今日やること</h1>
          <p class="date" id="today"></p>
        </div>
        <div class="progress" aria-live="polite">
          <strong id="progress-count">0 / 0</strong>
          <span>完了</span>
        </div>
      </header>

      <section class="card" aria-labelledby="task-heading">
        <h2 id="task-heading" class="sr-only">タスク一覧</h2>
        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">新しいタスク</label>
          <input id="task-input" type="text" maxlength="100" placeholder="新しいタスクを入力..." autocomplete="off" required />
          <button type="submit" class="add-button" aria-label="タスクを追加">
            <span aria-hidden="true">＋</span> 追加
          </button>
        </form>

        <div class="list-heading">
          <p>タスク</p>
          <p id="remaining-count">0 件</p>
        </div>
        <ul id="task-list" class="task-list"></ul>
        <div id="empty-state" class="empty-state">
          <span aria-hidden="true">✓</span>
          <p>タスクはまだありません</p>
          <small>上のフォームから追加してみましょう</small>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
